[tasks.tui-gen-scenarios]
description = "Generate scenarios for jq function"
usage = '''
arg "<function>" help="jq function name (for example: select)"
'''
run = "bash scripts/tui/gen-scenarios.sh ${usage_function?}"

[tasks.tui-explore-paths]
description = "Generate path scenarios from fixture"
usage = '''
arg "<fixture>" help="Fixture JSON file (for example: demo/demo.json)"
'''
run = "bash scripts/tui/explore-paths.sh ${usage_fixture?}"

[tasks.tui-validate-scenario]
description = "Validate scenario YAML structure"
usage = '''
arg "<scenario_file>" help="Scenario YAML file to validate"
'''
run = "bash scripts/tui/validate-scenario.sh ${usage_scenario_file?}"

[tasks.tui-edit-scenario]
description = "Open scenario file at the given scenario ID in $EDITOR (default: vi)"
shell = "bash -c"
usage = '''
arg "<scenario_path>" help="Scenario YAML file or directory" default="test-scenarios/"
flag "--id <scenario_id>" help="Exact scenario id"
'''
run = '''
set -eo pipefail

scenario_path="${usage_scenario_path?}"
scenario_id="${usage_id:-}"

# Resolve to absolute path
[[ "$scenario_path" != /* ]] && scenario_path="$PWD/$scenario_path"

if [ -f "$scenario_path" ]; then
  scenario_file="$scenario_path"
elif [ -d "$scenario_path" ]; then
  if [ -z "$scenario_id" ]; then
    echo "ERROR: --id is required when scenario path is a directory"
    exit 1
  fi
  scenario_file=""
  while IFS= read -r f; do
    json=$(bash scripts/tui/lib/yaml2json.sh "$f" 2>/dev/null) || continue
    count=$(echo "$json" | jaq --arg id "$scenario_id" '[.scenarios[]? | select(.id == $id)] | length' 2>/dev/null || echo 0)
    if [ "$count" = "1" ]; then scenario_file="$f"; break; fi
  done < <(rg --files "$scenario_path" -g '*.yaml')
  [ -z "$scenario_file" ] && { echo "ERROR: scenario id not found: $scenario_id"; exit 1; }
else
  echo "ERROR: scenario path not found: $scenario_path"; exit 1
fi

# Find line number of the id entry (first match)
line=1
if [ -n "$scenario_id" ]; then
  found=$(grep -n "id: $scenario_id" "$scenario_file" | head -1 | cut -d: -f1)
  [ -n "$found" ] && line="$found"
fi

exec "${EDITOR:-vi}" "+$line" "$scenario_file"
'''

[tasks.tui-launch-scenario]
description = "Build jqpp and launch using scenario input"
shell = "bash -c"
usage = '''
arg "<scenario_path>" help="Scenario YAML file or directory" default="test-scenarios/"
flag "--id <scenario_id>" help="Exact scenario id (defaults to first scenario in file)"
flag "--no-query" help="Ignore scenario query/filter and launch with empty query"
flag "--print-only" help="Print resolved command without launching"
'''
run = '''
set -eo pipefail

args=()
[ -n "${usage_id:-}" ] && args+=(--id "$usage_id")
[ "${usage_no_query:-false}" = "true" ] && args+=(--no-query)
[ "${usage_print_only:-false}" = "true" ] && args+=(--print-only)

bash scripts/tui/launch-scenario.sh "${args[@]}" "${usage_scenario_path?}"
'''

[tools]
rust = "1.95"
node = "lts"
"aqua:01mf02/jaq" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"npm:agent-tui" = "latest"
