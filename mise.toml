[tasks.demo]
description = "Regenerate demo GIF"
run = "cargo build --release && PATH=\"$PWD/target/release:$PATH\" vhs demo/demo.tape"

[tasks.setup-hooks]
description = "Configure git to use repo commit hooks"
run = "git config core.hooksPath .githooks && echo 'Hooks configured.'"

[tasks.tui-screenshot-tests]
description = "Run screenshot parsing unit tests"
run = "bash scripts/tui/lib/screenshot_test.sh"

[tasks.tui-run-scenarios]
description = "Run scenario suite with optional filters"
quiet = true
shell = "bash -c"
usage = '''
arg "<target>" help="Scenario file or directory" default="test-scenarios/"
flag "--id <id>" help="Only run one exact scenario id"
flag "--scenario <id>" help="Only run scenario IDs containing this text"
flag "--query-starts-with <prefix>" help="Only run scenarios whose query starts with this prefix"
flag "--query-function <function>" help="Only run scenarios whose query uses this function"
flag "--created-before <date>" help="Only include files with meta.created before date"
flag "--created-with-version <version>" help="Only include files with meta.jqpp_version containing version"
flag "--list" help="List matched scenarios without executing"
'''
run = '''
set -eo pipefail

args=()
[ "${usage_list:-false}" = "true" ] && args+=(--list-scenarios)
[ -n "${usage_id:-}" ] && args+=(--id "$usage_id")
[ -n "${usage_scenario:-}" ] && args+=(--scenario "$usage_scenario")
[ -n "${usage_query_starts_with:-}" ] && args+=(--query-starts-with "$usage_query_starts_with")
[ -n "${usage_query_function:-}" ] && args+=(--query-function "$usage_query_function")
[ -n "${usage_created_before:-}" ] && args+=(--created-before "$usage_created_before")
[ -n "${usage_created_with_version:-}" ] && args+=(--created-with-version "$usage_created_with_version")

bash scripts/tui/run-scenarios.sh "${args[@]}" "${usage_target?}"
'''

